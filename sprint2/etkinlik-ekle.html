<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2416501021.css">
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="POST">
            <div>
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" required>
                <small class="hata">Etkinlik adı boş bırakılamaz.</small>
            </div>
            <div>
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Konser">Konser</option>
                </select>
                <small class="hata">Lütfen bir kategori seçin.</small>
            </div>
            <div>
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" required>
                <small class="hata">Tarih boş bırakılamaz.</small>
            </div>
            <div>
                <label for="saat">Saat</label>
                <input type="time" id="saat" name="saat" required>
                <small class="hata">Saat boş bırakılamaz.</small>
            </div>
            <div>
                <label for="yer">Yer</label>
                <input type="text" id="yer" name="yer" required>
                <small class="hata">Yer boş bırakılamaz.</small>
            </div>
            <div>
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
                <small class="hata">Açıklama boş bırakılamaz.</small>
            </div>
            <button type="submit">Kaydet</button>
        </form>
    </main>

    <footer>
        <p>Namık Özköse · 2416501021 · 2026</p>
    </footer>
</body>
</html>

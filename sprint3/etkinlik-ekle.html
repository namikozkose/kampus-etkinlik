<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2416501021.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
        </nav>
    </header>

    <main>
        <form id="etkinlik-formu" action="#" method="POST" novalidate>
            <div>
                <label for="ad">Etkinlik adı *</label>
                <input type="text" id="ad" name="ad" required>
                <span id="ad-hata" style="display:none;"></span>
            </div>
            <div>
                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Konser">Konser</option>
                </select>
                <span id="kategori-hata" style="display:none;"></span>
            </div>
            <div>
                <label for="tarih">Tarih *</label>
                <input type="date" id="tarih" name="tarih" required>
                <span id="tarih-hata" style="display:none;"></span>
            </div>
            <div>
                <label for="saat">Saat *</label>
                <input type="time" id="saat" name="saat" required>
                <span id="saat-hata" style="display:none;"></span>
            </div>
            <div>
                <label for="yer">Yer *</label>
                <input type="text" id="yer" name="yer" required>
                <span id="yer-hata" style="display:none;"></span>
            </div>
            <div>
                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
                <span id="kontenjan-hata" style="display:none;"></span>
            </div>
            <div>
                <label for="aciklama">Açıklama *</label>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
                <span id="aciklama-hata" style="display:none;"></span>
            </div>
            <button type="submit">Kaydet</button>
        </form>
        <div id="form-mesaj"></div>
    </main>

    <footer>
        <p>Namık Özköse · 2416501021 · 2026</p>
    </footer>
</body>
</html>

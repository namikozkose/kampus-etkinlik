<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etkinlikler - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2416501021.css">
    <script type="module" src="js/event-list.js"></script>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html" aria-current="page">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tüm Etkinlikler</h2>
            <form id="filtre-formu" class="filtre">
                <div>
                    <label for="arama">Etkinlik ara</label>
                    <input type="search" id="arama" placeholder="Örn. atölye, kariyer">
                </div>
                <div>
                    <label for="kategori-filtre">Kategori</label>
                    <select id="kategori-filtre">
                        <option value="">Tümü</option>
                    </select>
                </div>
            </form>
            <p id="sonuc" style="margin-bottom: 2rem; color: #2a7a38; font-weight: bold;"></p>

            <div id="etkinlik-listesi" class="kartlar kartlar--uc"></div>
        </section>

        <section>
            <h2>Ayın Programı</h2>
            <div class="tablo-kutu">
                <table>
                    <caption>Ekim Ayı Özet Programı</caption>
                    <tr>
                        <th>Tarih</th>
                        <th>Etkinlik</th>
                        <th>Yer</th>
                    </tr>
                    <tr>
                        <td>12 Ekim</td>
                        <td>Kariyer Günleri</td>
                        <td>A Blok</td>
                    </tr>
                    <tr>
                        <td>20 Ekim</td>
                        <td>Robotik Atölyesi</td>
                        <td>Lab 2</td>
                    </tr>
                    <tr>
                        <td>27 Ekim</td>
                        <td>Siber Güvenlik</td>
                        <td>B Blok</td>
                    </tr>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Namık Özköse · 2416501021 · 2026</p>
    </footer>
</body>
</html>
